#Mouse config ---------------------
# PAW3222 driver has no invert/swap/report-interval Kconfig options;
# axis inversion is done via input-processors (trackball_listener in
# boards/shields/mona2/mona2-common.dtsi, applied on the dongle).

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y

#Bluetooth config -------------------
# Fast connection interval to the dongle (7.5–15 ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Right half is now a peripheral: layer colors and ZMK Studio moved to the dongle.
