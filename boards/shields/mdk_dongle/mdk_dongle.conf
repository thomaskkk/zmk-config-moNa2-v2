# ZMK has no board defaults for nrf52840_mdk_usb_dongle (unlike nice!nano /
# XIAO), so mirror what ZMK's own seeeduino_xiao_ble.conf sets.

# USB HID to the host
CONFIG_ZMK_USB=y

# No UART console on the dongle
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Persistent settings (BLE bonds, keymap edits from ZMK Studio)
CONFIG_SETTINGS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
